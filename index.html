<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasarım Kalıpları Atölyesi</title>
  <meta name="description" content="Yazılım tasarım kalıplarını animasyonlar ve Java örnekleriyle anlatan interaktif ders materyali.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='26' height='26' rx='6' fill='%234f46e5'/%3E%3Crect x='34' y='4' width='26' height='26' rx='6' fill='%2310b981'/%3E%3Crect x='4' y='34' width='26' height='26' rx='6' fill='%23f59e0b'/%3E%3Crect x='34' y='34' width='26' height='26' rx='13' fill='%23e11d48'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Tema ve yakınlaştırma ilk boyamadan önce uygulanır (ekran yanıp sönmesin diye).
    (function () {
      var root = document.documentElement, theme = null, scale = null;
      try {
        theme = JSON.parse(localStorage.getItem('dp.theme'));
        scale = JSON.parse(localStorage.getItem('dp.scale'));
      } catch (e) { /* depolama kapalı olabilir */ }
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      root.setAttribute('data-theme', theme);
      if (typeof scale === 'number') root.style.setProperty('--scale', scale);
    })();
  </script>
</head>
<body>
  <div id="app" class="app"></div>
  <noscript><p style="padding:2rem">Bu uygulama JavaScript gerektirir.</p></noscript>

  <script src="js/shared/lojistik.js"></script>

  <!-- Factory Method -->
  <script src="js/patterns/factory-method/data.js"></script>
  <script src="js/patterns/factory-method/stage.js"></script>
  <script src="js/patterns/factory-method/scenes-1.js"></script>
  <script src="js/patterns/factory-method/scenes-2.js"></script>
  <script src="js/patterns/factory-method/scenes-3.js"></script>
